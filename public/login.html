<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FantasyX Login</title><link rel="stylesheet" href="/style.css?v=56"></head><body><main><div class="card" style="max-width:440px;margin:8vh auto"><h1>⚽ FantasyX</h1><h2>Log in</h2><p>Use your FantasyX username and password. No email or magic link needed.</p><input id="username" autocomplete="username" placeholder="Username" style="width:100%;margin:8px 0"><input id="password" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;margin:8px 0"><label style="display:flex;align-items:center;gap:8px;margin:6px 0 12px"><input id="show" type="checkbox"> Show password</label><button id="go" style="width:100%;padding:12px">Log in</button><p id="msg"></p><p>New here? <a href="/signup.html">Create an account</a></p></div></main><script>const u=document.getElementById('username'),p=document.getElementById('password'),m=document.getElementById('msg'),b=document.getElementById('go');document.getElementById('show').onchange=e=>p.type=e.target.checked?'text':'password';async function go(){const username=u.value.trim(),password=p.value;if(!username||!password){m.textContent='Enter your username and password.';return}b.disabled=true;m.textContent='Logging in…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not log in.');m.textContent='Logged in ✓';location.href='/'}catch(e){m.textContent=e.message}finally{b.disabled=false}}b.onclick=go;[u,p].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));</script></body></html>
