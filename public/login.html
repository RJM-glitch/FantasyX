<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FantasyX Login</title><link rel="stylesheet" href="/style.css?v=55"></head><body><main><div class="card" style="max-width:440px;margin:8vh auto"><h1>⚽ FantasyX</h1><h2>Log in</h2><p>Log in with your email and password. No sign-in email is needed each time.</p><input id="email" type="email" autocomplete="email" placeholder="Email" style="width:100%;margin:8px 0"><input id="password" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;margin:8px 0"><label style="display:flex;align-items:center;gap:8px;margin:6px 0 12px"><input id="show" type="checkbox"> Show password</label><button id="go" style="width:100%;padding:12px">Log in</button><p id="msg"></p><p>New here? <a href="/signup.html">Create an account</a></p></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://gjkivetatcnskoszsdzf.supabase.co','sb_publishable_x-etGDngNtgDlY4d4gJsXg_FrbplfY2'),e=document.getElementById('email'),p=document.getElementById('password'),m=document.getElementById('msg'),b=document.getElementById('go');document.getElementById('show').onchange=x=>p.type=x.target.checked?'text':'password';async function login(){const email=e.value.trim(),password=p.value;if(!email||!password){m.textContent='Enter your email and password.';return}b.disabled=true;m.textContent='Logging in…';const{error}=await s.auth.signInWithPassword({email,password});b.disabled=false;if(error){m.textContent=error.message==='Invalid login credentials'?'Email or password is incorrect.':error.message;return}m.textContent='Logged in ✓';location.href='/'}b.onclick=login;[e,p].forEach(x=>x.addEventListener('keydown',ev=>{if(ev.key==='Enter')login()}));</script></body></html>
