<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100b2b"/><stop offset=".42" stop-color="#21114b"/><stop offset="1" stop-color="#06172a"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#8b38ff" stop-opacity=".62"/><stop offset="1" stop-color="#8b38ff" stop-opacity="0"/></radialGradient>
 <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3a1b62"/><stop offset="1" stop-color="#08162b"/></linearGradient>
 <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#087a5c"/><stop offset="1" stop-color="#031f22"/></linearGradient>
 <linearGradient id="board"><stop stop-color="#35105d"/><stop offset=".5" stop-color="#1b67db"/><stop offset="1" stop-color="#35105d"/></linearGradient>
 <pattern id="crowd" width="24" height="19" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="2" fill="#a9d9ff" opacity=".7"/><circle cx="14" cy="11" r="2.5" fill="#d1a6ff" opacity=".62"/><circle cx="21" cy="3" r="1.5" fill="#fff" opacity=".55"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
</defs>
<rect width="1800" height="1000" fill="url(#sky)"/>
<circle cx="900" cy="280" r="410" fill="url(#glow)"/>
