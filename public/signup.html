<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create FantasyX Account</title><link rel="stylesheet" href="/style.css?v=55"></head><body><main><div class="card" style="max-width:440px;margin:8vh auto"><h1>⚽ FantasyX</h1><h2>Create account</h2><p>Create an account with an email and password. After setup, normal logins do not send a magic link.</p><input id="email" type="email" autocomplete="email" placeholder="Email" style="width:100%;margin:8px 0"><input id="password" type="password" autocomplete="new-password" placeholder="Password (8+ characters)" style="width:100%;margin:8px 0"><input id="confirm" type="password" autocomplete="new-password" placeholder="Confirm password" style="width:100%;margin:8px 0"><label style="display:flex;align-items:center;gap:8px;margin:6px 0 12px"><input id="show" type="checkbox"> Show passwords</label><button id="go" style="width:100%;padding:12px">Create account</button><p id="msg"></p><p>Already have an account? <a href="/login.html">Log in</a></p></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://gjkivetatcnskoszsdzf.supabase.co','sb_publishable_x-etGDngNtgDlY4d4gJsXg_FrbplfY2'),e=document.getElementById('email'),p=document.getElementById('password'),c=document.getElementById('confirm'),m=document.getElementById('msg'),b=document.getElementById('go');document.getElementById('show').onchange=x=>{p.type=c.type=x.target.checked?'text':'password'};async function signup(){const email=e.value.trim(),password=p.value;if(!email||!password){m.textContent='Enter your email and password.';return}if(password.length<8){m.textContent='Use at least 8 characters for your password.';return}if(password!==c.value){m.textContent='Passwords do not match.';return}b.disabled=true;m.textContent='Creating account…';const{data,error}=await s.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/'}});b.disabled=false;if(error){m.textContent=error.message;return}if(data.session){m.textContent='Account created ✓';location.href='/';return}m.textContent='Account created. Check your email once to confirm it, then use your password to log in.'}b.onclick=signup;[e,p,c].forEach(x=>x.addEventListener('keydown',ev=>{if(ev.key==='Enter')signup()}));</script></body></html>
