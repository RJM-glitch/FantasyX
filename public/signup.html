<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create FantasyX Account</title><link rel="stylesheet" href="/style.css?v=56"></head><body><main><div class="card" style="max-width:440px;margin:8vh auto"><h1>⚽ FantasyX</h1><h2>Create account</h2><p>Create a FantasyX username and password. No email is required.</p><input id="username" autocomplete="username" placeholder="Username (3–24 characters)" style="width:100%;margin:8px 0"><input id="password" type="password" autocomplete="new-password" placeholder="Password (8+ characters)" style="width:100%;margin:8px 0"><input id="confirm" type="password" autocomplete="new-password" placeholder="Confirm password" style="width:100%;margin:8px 0"><label style="display:flex;align-items:center;gap:8px;margin:6px 0 12px"><input id="show" type="checkbox"> Show passwords</label><button id="go" style="width:100%;padding:12px">Create account</button><p id="msg"></p><p>Already have an account? <a href="/login.html">Log in</a></p></div></main><script>const u=document.getElementById('username'),p=document.getElementById('password'),c=document.getElementById('confirm'),m=document.getElementById('msg'),b=document.getElementById('go');document.getElementById('show').onchange=e=>{p.type=c.type=e.target.checked?'text':'password'};async function go(){const username=u.value.trim(),password=p.value;if(!/^[A-Za-z0-9_]{3,24}$/.test(username)){m.textContent='Username must be 3–24 characters using letters, numbers or _.';return}if(password.length<8){m.textContent='Use at least 8 characters for your password.';return}if(password!==c.value){m.textContent='Passwords do not match.';return}b.disabled=true;m.textContent='Creating account…';try{const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not create account.');m.textContent='Account created ✓';location.href='/'}catch(e){m.textContent=e.message}finally{b.disabled=false}}b.onclick=go;[u,p,c].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));</script></body></html>
